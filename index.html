<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Calculator</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.2/math.min.js"></script>
</head>
<body>

<div class="background"></div>

<div class="calculator">

    <input type="text" id="display" readonly>

    <div class="buttons">

        <button onclick="clearDisplay()">C</button>
        <button onclick="addValue('(')">(</button>
        <button onclick="addValue(')')">)</button>
        <button onclick="backspace()">⌫</button>

        <button onclick="addValue('sin(')">sin</button>
        <button onclick="addValue('cos(')">cos</button>
        <button onclick="addValue('tan(')">tg</button>
        <button onclick="addValue('log(')">log</button>

        <button onclick="addValue('asin(')">arcsin</button>
        <button onclick="addValue('acos(')">arccos</button>
        <button onclick="addValue('atan(')">arctan</button>
        <button onclick="addValue('pi')">π</button>

        <button onclick="addValue('sinh(')">sh</button>
        <button onclick="addValue('cosh(')">ch</button>
        <button onclick="addValue('tanh(')">th</button>
        <button onclick="addValue('e')">e</button>

        <button onclick="factorial()">x!</button>
        <button onclick="power2()">x²</button>
        <button onclick="power3()">x³</button>
        <button onclick="randomNum()">Rand</button>

        <button onclick="addValue('7')">7</button>
        <button onclick="addValue('8')">8</button>
        <button onclick="addValue('9')">9</button>
        <button onclick="addValue('/')">÷</button>

        <button onclick="addValue('4')">4</button>
        <button onclick="addValue('5')">5</button>
        <button onclick="addValue('6')">6</button>
        <button onclick="addValue('*')">×</button>

        <button onclick="addValue('1')">1</button>
        <button onclick="addValue('2')">2</button>
        <button onclick="addValue('3')">3</button>
        <button onclick="addValue('-')">−</button>

        <button onclick="addValue('0')">0</button>
        <button onclick="addValue('.')">.</button>
        <button onclick="toggleRad()">Rad</button>
        <button onclick="addValue('+')">+</button>

        <button class="equal" onclick="calculate()">=</button>

    </div>
</div>

<script src="script.js"></script>

</body>
</html>
